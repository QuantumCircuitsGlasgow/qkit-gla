name: Windows Build, Pre-commit and Test

on:
  push:
    branches:
      - main
      - release
  workflow_dispatch: {}

jobs:
  windows-build-test:
    name: Build & Test on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Upgrade pip and install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel twine pre-commit pytest
        shell: pwsh

      - name: Install project dependencies (if present)
        run: |
          if (Test-Path requirements-pinned.txt) {
            python -m pip install -r requirements-pinned.txt
          } elseif (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          } else {
            Write-Host 'No requirements file found; continuing'
          }
        shell: pwsh

      - name: Install development tools for pre-commit hooks
        run: |
          # Install common formatting/linting tools used by hooks
          python -m pip install black isort ruff mypy autoflake pyupgrade vulture
        shell: pwsh

      - name: Run pre-commit hooks (from branch code)
        run: |
          # Ensure pre-commit is installed and run hooks against the checked-out branch
          python -m pre_commit install --config .pre-commit-config.yaml || true
          python -m pre_commit run --all-files --config .pre-commit-config.yaml || true
        shell: pwsh

      - name: Build package
        run: |
          python -m build
        shell: pwsh

      - name: Run tests with pytest
        run: |
          mkdir -Force reports
          python -m pytest --junitxml=reports/junit.xml -q || true
        shell: pwsh

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/*

# ===========Create a GitHub Release and upload dist files as release assets=================
      - name: Create GitHub Release (on release branch or tags)
        if: "startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/release'"
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Automated release ${{ github.ref_name }}
          body: |
            Automated release created by CI for ref `${{ github.ref }}`.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload wheel to GitHub Release (if release created)
        if: steps.create_release.outputs.upload_url != ''
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/*.whl
          asset_name: ${{ github.repository }}-${{ github.sha }}.whl
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload sdist to GitHub Release (if release created)
        if: steps.create_release.outputs.upload_url != ''
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/*.tar.gz
          asset_name: ${{ github.repository }}-${{ github.sha }}.tar.gz
          asset_content_type: application/gzip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish to TestPyPI (only on main or release branch)
      - name: Publish to TestPyPI
        if: "github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release'"
        run: |
          python -m pip install --upgrade twine
          python -m twine upload --repository testpypi dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}

      # Real PyPI publishing (commented out). Uncomment & configure secrets to enable.
      - name: Publish to PyPI (REAL)  # COMMENTED OUT - DO NOT ENABLE UNLESS READY
        if: false
        run: |
          # python -m pip install --upgrade twine
          # python -m twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

#==========================================================================

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: pytest-reports
          path: reports/**

