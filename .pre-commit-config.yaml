# .pre-commit-config.yaml
repos:


  - repo: local
    hooks:


      - id: black-logged
        name: black (logged)
        entry: python .precommit_hooks/black_wrapper.py
        language: system
        types: [python]

      - id: autoflake-logged
        name: autoflake (logged)
        entry: python .precommit_hooks/autoflake_wrapper.py
        language: system
        types: [python]

      - id: isort-logged
        name: isort (logged)
        entry: python .precommit_hooks/isort_wrapper.py
        language: system
        types: [python]

      - id: ruff-logged
        name: ruff (logged)
        entry: python .precommit_hooks/ruff_wrapper.py
        language: system
        types: [python]

      - id: mypy-logged
        name: mypy (logged)
        entry: python .precommit_hooks/mypy_wrapper.py
        language: system
        types: [python]
        
      - id: pyupgrade-logged
        name: pyupgrade (logged)
        entry: python .precommit_hooks/pyupgrade_wrapper.py
        language: system
        types: [python]

      - id: vulture-logged
        name: vulture (logged)
        entry: python .precommit_hooks/vulture_wrapper.py
        language: system
        types: [python]


