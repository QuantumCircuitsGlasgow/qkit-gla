[pytest]
minversion = 6.0
; Additional pytest options
addopts = -ra -q --strict-markers --strict-config --tb=short

; Where to find tests
testpaths = qkit/tests

; Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

; Custom markers
markers =
    unit: Unit tests
    integration: Integration tests
    hardware: Tests requiring hardware
    slow: Slow running tests
    driver: Driver-specific tests
    analysis: Analysis module tests
    core: Core module tests

; Warnings to filter
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning

; Minimum coverage percentage (optional)
; addopts = --cov=qkit --cov-report=term-missing --cov-fail-under=80