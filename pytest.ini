[pytest]
minversion = 6.0
; Additional pytest options
addopts = -ra -q --strict-markers --strict-config --tb=short

; Where to find tests
testpaths = qkit/tests

; Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

; Custom markers for different test types
markers =
    unit: Unit tests (fast, pre-build, no external dependencies)
    integration: Integration tests (post-build, module interactions)
    hardware: Hardware-dependent tests (require real instruments)
    slow: Slow running tests (>10 seconds)
    
    ; Module-specific markers
    core: Core module tests (startup, instruments, flow)
    drivers: Driver-specific tests (instrument drivers)
    analysis: Analysis module tests (fitting, data processing)
    measure: Measurement module tests (spectroscopy, transport)
    storage: Storage module tests (HDF5, file operations)
    services: Services module tests (info, remote interface)
    
    ; Test characteristics
    visa: Tests requiring VISA/instrument communication
    network: Tests requiring network connectivity
    filesystem: Tests that create/modify files

; Warnings to filter
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

; Test collection timeout
timeout = 300

; Minimum coverage percentage (optional)
; addopts = --cov=qkit --cov-report=term-missing --cov-fail-under=80